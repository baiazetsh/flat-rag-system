services:

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - qdrant
      - ollama
    networks:
      - rag_net
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    env_file:
      - .env
    environment:
      LLM_MODEL: "${LLM_MODEL}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - rag_net

  qdrant:
    container_name: rag_qdrant
    image: qdrant/qdrant:v1.10.0
    mem_limit: 1g
    cpus: 1.0    
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - rag_net

networks:
  rag_net:
    driver: bridge

volumes:
  qdrant_data:
  ollama_data:
