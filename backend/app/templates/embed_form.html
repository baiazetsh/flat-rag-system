<!-- app/templates/embed_form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🧬 Embed Text to Vector DB</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center text-gray-900">
  <div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-lg">
    <h1 class="text-2xl font-bold text-indigo-700 mb-4 text-center">
      🧬 Embed Text to Vector DB
    </h1>
    <p class="text-sm text-gray-500 text-center mb-6">
      Enter text and choose a collection to embed it into your vector database.
    </p>

    <form id="embedForm" class="flex flex-col gap-4">
      <textarea
        name="text"
        placeholder="Enter text to embed..."
        required
        class="border border-gray-300 rounded-lg p-3 h-32 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      ></textarea>

      <select
        name="collection"
        class="border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      >
        {% for c in collections %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>

      <button
        type="submit"
        class="bg-indigo-600 text-white font-semibold rounded-lg py-2 hover:bg-indigo-700 transition"
      >
        Embed & Save
      </button>
    </form>

    <div id="result" class="mt-6 text-sm text-gray-700 hidden"></div>
  </div>

  <script>
    const form = document.getElementById('embedForm');
    const resultBox = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultBox.classList.remove('hidden');
      resultBox.textContent = "⏳ Embedding...";
      
      const data = {
        text: form.text.value,
        collection: form.collection.value
      };

      try {
        const res = await fetch("/api/embed/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const json = await res.json();
        if (!res.ok) throw new Error(json.detail || "Unknown error");

        resultBox.innerHTML = `
          ✅ <strong>Success!</strong><br>
          Collection: <code>${json.collection}</code><br>
          Vector dimension: ${json.vector_dim}
        `;
        resultBox.classList.add("text-green-700");
      } catch (err) {
        resultBox.textContent = "❌ Error: " + err.message;
        resultBox.classList.add("text-red-700");
      }
    });
  </script>
</body>
</html>
