services:

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - CUDA_VISIBLE_DEVICES=-1 
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped
    networks:
      - rag_net
          
    deploy:
      resources:
        reservations:
          devices: []
        limits:
          memory: 8g

    
    

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    env_file:
      - .env
    environment:
      LLM_MODEL: "${LLM_MODEL}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
      OLLAMA_KEEP_ALIVE: "300"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    #runtime: nvidia

    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 1000s
      timeout: 3s
      retries: 3
    networks:
      - rag_net

  qdrant:
    container_name: rag_qdrant
    image: qdrant/qdrant:v1.10.0
       
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 300s
      timeout: 5s
      retries: 3
    networks:
      - rag_net

networks:
  rag_net:
    driver: bridge

volumes:
  qdrant_data:
  ollama_data:
  hf_cache:

