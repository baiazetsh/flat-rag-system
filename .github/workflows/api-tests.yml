name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run API test suite
        working-directory: ./backend
        run: |
          pytest -m api -v
